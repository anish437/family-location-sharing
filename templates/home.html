<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Family Location Sharing</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
        }

        .container {

            width: 90%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.10);
        }

        h1 {

            margin-bottom: 10px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }

        .button {

            display: block;

            width: 100%;

            padding: 14px;

            margin: 12px 0;

            border-radius: 8px;

            text-decoration: none;

            color: white;

            font-size: 16px;

            font-weight: bold;
        }

        .create {

            background: #198754;
        }

        .join {

            background: #0d6efd;
        }

        .login {

            background: #6c757d;
        }

        .button:hover {

            opacity: 0.9;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            👨‍👩‍👧 Family Location Sharing
        </h1>

        <p class="subtitle">
            Create or join a private family
            and share your location with
            approved members.
        </p>


        <a
            href="/create-family"
            class="button create"
        >
            🏠 Create a Family
        </a>


        <a
            href="/join-family"
            class="button join"
        >
            👥 Join a Family
        </a>


        <a
            href="/member-login"
            class="button login"
        >
            🔐 Member Login
        </a>

    </div>

</body>

</html>
