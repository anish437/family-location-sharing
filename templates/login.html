<!DOCTYPE html>
<html>
<head>
    <title>Family Location Login</title>
</head>

<body>

    <h1>🔐 Family Location</h1>

    <h2>Login</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Username:</label>
        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password:</label>
        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>
</html>
